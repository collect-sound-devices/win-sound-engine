name: Build and save artifacts

on:
  push:
    branches:
      - main
    tags:
      - 'Release-*'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup-and-compute-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine version (SemVer)
        id: get_version
        shell: pwsh
        run: |
          $ref = $env:GITHUB_REF
          # Find the latest Release-* tag.
          $latestTag = git describe --tags --match "Release-*" --abbrev=0
          if (-not $latestTag) {
              Write-Host "No Release tag found. Using default version 1.0.0."
              "VERSION=1.0.0" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
              "version=1.0.0" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
              exit 0
          }
          # Extract version number from the tag (e.g., Release-1.0.1 -> 1.0.1)
          $versionNumber = $latestTag -replace '^Release-', ''
          Write-Host "latestTag: $latestTag, versionNumber: $versionNumber"
          if ($versionNumber -notmatch '^\d+\.\d+\.\d+$') {
              Write-Host "::error::Tag '$latestTag' is not in the form Release-X.Y.Z"
              exit 1
          }
          $distance = git rev-list --count "$latestTag..HEAD"
          
          # Append -rc<distance> if distance is greater than 0
          if ($distance -gt 0) {
              # Increment the patch number for a prerelease build
              $versionParts = $versionNumber -split '\.'
              $versionParts[2] = [int]$versionParts[2] + 1
              $versionNumber = $versionParts -join '.'
              Write-Output "VERSION CORRECTED, versionNumber: $versionNumber"
              $version = "$versionNumber-rc.$distance"
          } else {
              $version = $versionNumber
          }
          $version = 'v' + $version
          Write-Host "Derived development version: $version (base tag: $latestTag)"
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Using version: $version"

  build:
    runs-on: windows-2025-vs2026
    needs: setup-and-compute-version
    env:
      TAG_VERSION: ${{ needs.setup-and-compute-version.outputs.version }}
      GO_APP_NAME: win-sound-logger

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: true

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Ensure vcpkg, integrate with MSBuild and install manifest deps
        shell: pwsh
        run: |
          $vcpkgDir = 'C:\vcpkg'
          if (-not (Test-Path (Join-Path $vcpkgDir 'vcpkg.exe'))) {
            Write-Host "Cloning vcpkg..."
            git clone --depth 1 https://github.com/microsoft/vcpkg.git $vcpkgDir
            Write-Host "Bootstrapping vcpkg..."
            & "$vcpkgDir\bootstrap-vcpkg.bat" -disableMetrics
          }

          Write-Host "Integrating vcpkg with MSBuild..."
          & "$vcpkgDir\vcpkg.exe" integrate install

          # Install manifest dependencies from the workspace root
          Write-Host "Installing vcpkg manifest dependencies..."
          & "$vcpkgDir\vcpkg.exe" install --triplet x64-windows-static --x-install-root="$PWD\vcpkg_installed\x64-windows-static"
    
          # Set environment variables for the build step
          "VCPKG_ROOT=$vcpkgDir" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_DEFAULT_TRIPLET=x64-windows-static" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build with MSBuild
        run: |
          msbuild /p:Configuration=Release /p:VcpkgEnabled=true /p:VcpkgManifestPath=vcpkg.json /p:VcpkgTriplet=x64-windows-static /p:VcpkgManifestInstall=false /target:Rebuild -restore /p:RestorePackagesConfig=true
          dotnet publish "Projects/SoundDefaultUI/SoundDefaultUI.csproj" -c Release -p:PublishProfile=FolderProfile -v:minimal

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'

      - name: Set app version (without v-prefix)
        shell: powershell
        run: |
          $version = "${{ env.TAG_VERSION }}"
          if (-not $version) {
            $version = "unknown"
          }
          if ($version.StartsWith("v")) {
            $version = $version.Substring(1)
          }
          Write-Host "Computed APP_VERSION=$version"
          "APP_VERSION=$version" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Go binary with GNU toolchain
        shell: powershell
        env:
          CC: gcc
          CXX: g++
        run: |
          .\scripts\buildGo.ps1 -msbuildConfig Release -respectExistingCompiler

      - name: Package go executable directory
        shell: powershell
        run: |
          $app_name = "${{ env.GO_APP_NAME }}"
          $artifactName = "$app_name-go-$Env:APP_VERSION.zip"
          Write-Host "Creating artifact $artifactName from x64/Release ..."
          $binPath = Join-Path $PWD "x64"
          $binPath = Join-Path $binPath "Release"
          if (-not (Test-Path -Path $binPath)) {
            throw "x64/Release directory not found; nothing to package."
          }
          $binSourceExe = Join-Path $binPath "$app_name.exe" 
          $binSourceDll = Join-Path $binPath "SoundAgentApi.dll"
          $destinationPath = Join-Path $PWD "artifacts"
          $destinationPath = Join-Path $destinationPath $artifactName
          Compress-Archive -Path $binSourceExe, $binSourceDll -DestinationPath $destinationPath -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: artifacts\

  publish:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/Release-')
    needs:
      - build
      - setup-and-compute-version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          name: Artifacts
          path: build

      - name: Create or update Release
        run: |
          VERS=${{ needs.setup-and-compute-version.outputs.version }}
          echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token
          if gh release view "$VERS" > /dev/null 2>&1; then
            echo "Release $VERS already exists; updating assets"
          else
            # rc builds (e.g. v1.2.4-rc.3) must not become "Latest"
            if [[ "$VERS" == *-rc.* ]]; then
              PRERELEASE_FLAG="--prerelease"
            else
              PRERELEASE_FLAG=""
            fi
            gh release create "$VERS" --target "$GITHUB_SHA" $PRERELEASE_FLAG --title "WinSoundEngine $VERS" --notes "Release $VERS"
          fi
          gh release upload "$VERS" build/*.* --clobber
